apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-s3-file
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-s3-file
  template:
    metadata:
      labels:
        app: aws-s3-file
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aws-s3-file
          image: ghcr.io/dileepna/aws-s3-file:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aws-s3-file
spec:
  selector:
    app: aws-s3-file
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
